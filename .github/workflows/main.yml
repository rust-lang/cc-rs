name: CI
on:
  # Every PR
  pull_request:
  push:
    branches:
    # Once merged into the head branch.
    - main

env:
  CARGO_INCREMENTAL: 0
  CC_ENABLE_DEBUG_OUTPUT: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build:
          [
            stable,
            beta,
            nightly,
            linux32,
            aarch64-macos,
            x86_64-macos,
            aarch64-ios,
            aarch64-ios-sim,
            x86_64-ios-sim,
            aarch64-ios-macabi,
            x86_64-ios-macabi,
            win32,
            win64,
            mingw32,
            mingw64,
            windows-2022,
          ]
        cargo_flags: ['', '--release', '--features parallel']
        include:
          - build: stable
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
          - build: beta
            os: ubuntu-latest
            rust: beta
            target: x86_64-unknown-linux-gnu
          - build: nightly
            os: ubuntu-latest
            rust: nightly
            target: x86_64-unknown-linux-gnu
          - build: linux32
            os: ubuntu-latest
            rust: stable
            target: i686-unknown-linux-gnu
          - build: aarch64-macos
            os: macos-latest
            rust: stable
            target: aarch64-apple-darwin
          - build: x86_64-macos
            os: macos-latest
            rust: stable
            target: x86_64-apple-darwin
          - build: aarch64-ios
            os: macos-latest
            rust: stable
            target: aarch64-apple-ios
            no_run: true
          - build: aarch64-ios-sim
            os: macos-latest
            rust: stable
            target: aarch64-apple-ios-sim
            no_run: true
          - build: x86_64-ios-sim
            os: macos-latest
            rust: stable
            target: x86_64-apple-ios # Simulator
            no_run: true
          - build: aarch64-ios-macabi
            os: macos-latest
            rust: stable
            target: aarch64-apple-ios-macabi
            no_run: true # FIXME(madsmtm): Fix running tests
          - build: x86_64-ios-macabi
            os: macos-latest
            rust: stable
            target: x86_64-apple-ios-macabi
            no_run: true # FIXME(madsmtm): Fix running tests
          - build: cross-macos-aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-apple-darwin
            no_run: true
          - build: cross-ios-aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-apple-ios
            no_run: true
          - build: cross-windows-aarch64
            os: windows-latest
            rust: stable
            target: aarch64-pc-windows-msvc
            no_run: true
          - build: windows-aarch64
            os: windows-11-arm
            rust: stable
            target: aarch64-pc-windows-msvc
          - build: cross-windows-arm64ec
            os: windows-latest
            rust: beta
            target: arm64ec-pc-windows-msvc
            no_run: true
          - build: windows-arm64ec
            os: windows-11-arm
            rust: beta
            target: arm64ec-pc-windows-msvc
          - build: cross-win64
            os: windows-11-arm
            rust: stable
            target: x86_64-pc-windows-msvc
          - build: win32
            os: windows-2022
            rust: stable-i686-msvc
            target: i686-pc-windows-msvc
          - build: win64
            os: windows-latest
            rust: stable
            target: x86_64-pc-windows-msvc
          - build: mingw32
            os: windows-2022
            rust: stable-i686-gnu
            target: i686-pc-windows-gnu
          - build: mingw64
            os: windows-latest
            rust: stable-x86_64-gnu
            target: x86_64-pc-windows-gnu
          - build: windows-2022
            os: windows-2022
            rust: stable-x86_64
            target: x86_64-pc-windows-msvc
          - build: windows-clang
            os: windows-2022
            rust: stable
            target: x86_64-pc-windows-msvc
            CC: clang
            CXX: clang++
          - build: windows-clang-cl
            os: windows-2022
            rust: stable
            target: x86_64-pc-windows-msvc
            CC: clang-cl
            CXX: clang-cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: curl -vv https://static.rust-lang.org/dist/channel-rust-1.87.0.toml.sha256
        shell: bash
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          target: ${{ matrix.target }}
          toolchain: ${{ matrix.rust }}
      - name: Install g++-multilib
        run: |
          set -e
          # Remove the ubuntu-toolchain-r/test PPA, which is added by default.
          # Some packages were removed, and this is causing the g++multilib
          # install to fail. Similar issue:
          # https://github.com/scikit-learn/scikit-learn/issues/13928.
          sudo add-apt-repository --remove ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install g++-multilib
        if: matrix.build == 'linux32'
      - name: add clang to path
        if: startsWith(matrix.build, 'windows-clang')
        run: |
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          echo -e "AR=llvm-ar\nRUSTFLAGS=-Clinker=lld-link\nCC=${CC}\nCXX=${CXX}" >> "$GITHUB_ENV"
        shell: bash
        env:
          CC: ${{ matrix.CC }}
          CXX: ${{ matrix.CXX }}
      - name: Install llvm tools (for llvm-ar)
        if: startsWith(matrix.build, 'cross-macos') || startsWith(matrix.build, 'cross-ios')
        run: sudo apt-get install llvm
      - name: Download macOS SDK
        working-directory: ${{ runner.temp }}
        if: startsWith(matrix.build, 'cross-macos')
        run: |
          wget https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
          tar -xf MacOSX11.3.sdk.tar.xz
          echo "SDKROOT=$(pwd)/MacOSX11.3.sdk" >> $GITHUB_ENV
      - name: Download iOS SDK
        working-directory: ${{ runner.temp }}
        if: startsWith(matrix.build, 'cross-ios')
        run: |
          wget https://github.com/xybp888/iOS-SDKs/releases/download/iOS18.1-SDKs/iPhoneOS18.1.sdk.zip
          unzip iPhoneOS18.1.sdk.zip
          echo "SDKROOT=$(pwd)/iPhoneOS18.1.sdk" >> $GITHUB_ENV
      - name: Set up Apple cross-compilation
        if: startsWith(matrix.build, 'cross-macos') || startsWith(matrix.build, 'cross-ios')
        run: |
          # Test with clang/llvm for now, has better cross-compilation support (GCC requires downloading a different toolchain)
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          # Link with rust-lld
          UPPERCASE_TARGET_NAME=$(echo "${{ matrix.target }}" | tr '[:lower:]-' '[:upper:]_')
          echo "CARGO_TARGET_${UPPERCASE_TARGET_NAME}_LINKER=rust-lld" >> $GITHUB_ENV
      - name: setup dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: startsWith(matrix.build, 'windows-clang')

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        if: ${{ ! matrix.no_run }}
        with:
          tool: cargo-nextest

      - run: cargo update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and run binaries and tests
        run: |
          cargo build --bins --tests --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
      - name: Compile all test targets but not run
        if: matrix.no_run
        run: |
          cargo test --no-run --workspace --all-targets --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
      - name: Compile and Run tests
        if: ${{ ! matrix.no_run }}
        run: |
          cargo nextest run --workspace --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
          cargo test --doc --workspace --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  test-linker-plugin-lto:
     name: Test linker-plugin-lto
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
         with:
           persist-credentials: false

       - name: Install Rust
         uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
         with:
           cache: false
           toolchain: stable

       - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
         with:
           tool: cargo-nextest

       - run: cargo update
       - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
       - run: |
           cargo nextest run --workspace --release
         env:
           RUSTFLAGS: -C linker-plugin-lto
       # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
       - name: check clean Git workting tree
         uses: ./.github/actions/check-clean-git-working-tree

  # This is separate from the matrix above because there is no prebuilt rust-std component for these targets.
  check-build-std:
    name: Test build-std
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64h-apple-darwin
          # FIXME(madsmtm): needs deployment target
          # - armv7s-apple-ios
          # FIXME(madsmtm): needs deployment target
          # - i386-apple-ios # Simulator
          - aarch64-apple-tvos
          - aarch64-apple-tvos-sim
          - x86_64-apple-tvos # Simulator
          - aarch64-apple-watchos
          - aarch64-apple-watchos-sim
          - x86_64-apple-watchos-sim
          # FIXME(madsmtm): needs deployment target
          # - arm64_32-apple-watchos
          # FIXME(nobodyxu): https://github.com/rust-lang/rust/issues/147776
          # - armv7k-apple-watchos
          - aarch64-apple-visionos
          - aarch64-apple-visionos-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: rust-src
          toolchain: nightly
      - run: cargo update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test -Z build-std=std --no-run --workspace --target ${{ matrix.target }}
      - run: cargo test -Z build-std=std --no-run --workspace --target ${{ matrix.target }} --release
      - run: cargo test -Z build-std=std --no-run --workspace --target ${{ matrix.target }} --features parallel
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  check-wasm:
    name: Test wasm
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          target: ${{ matrix.target }}
          toolchain: stable
      - run: cargo update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --no-run --target ${{ matrix.target }}
      - run: cargo test --no-run --target ${{ matrix.target }} --release
      - run: cargo test --no-run --target ${{ matrix.target }} --features parallel
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  # This is separate from the matrix above because there is no prebuilt
  # rust-std component for this target (tier 3), and no C toolchain for it is
  # available in CI, so only `cargo check` the crate itself.
  check-motor:
    name: Check Motor OS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-motor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: rust-src
          toolchain: nightly
      - run: cargo update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check -Z build-std=std,panic_abort -p cc --target ${{ matrix.target }}
      - run: cargo check -Z build-std=std,panic_abort -p cc --target ${{ matrix.target }} --release
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  test-wasi:
    name: Test wasm32-wasi* targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
        - wasm32-wasip1
        - wasm32-wasip2
        - wasm32-wasip1-threads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          target: ${{ matrix.target }}
          toolchain: nightly

      - name: Get latest version of wasi-sdk
        env:
          REPO: WebAssembly/wasi-sdk
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="$(gh release list --exclude-pre-releases --repo $REPO -L 1 --json tagName --jq '.[]|.tagName')"
          echo "WASI_TOOLCHAIN_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install wasi-sdk
        working-directory: ${{ runner.temp }}
        env:
          REPO: WebAssembly/wasi-sdk
        run: |
          set -euxo pipefail
          VERSION="$WASI_TOOLCHAIN_VERSION"
          FILE="${VERSION}.0-x86_64-linux.deb"
          wget "https://github.com/$REPO/releases/download/${VERSION}/${FILE}"
          sudo dpkg -i "${FILE}"
          WASI_SDK_PATH="/opt/wasi-sdk"
          echo "WASI_SDK_PATH=$WASI_SDK_PATH" >> "$GITHUB_ENV"

      - run: cargo update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          env-vars: "WASI_TOOLCHAIN_VERSION"
          cache-all-crates: "true"

      - name: Run tests
        run: cargo +nightly build -p wasi-test --target ${{ matrix.target }}

      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  cuda:
    name: Test CUDA support
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cuda-minimal-build-11-8
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          # https://developer.nvidia.com/cuda-downloads?target_os=Linux&target_arch=x86_64&Distribution=Ubuntu&target_version=20.04&target_type=deb_network
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-keyring_1.0-1_all.deb
          sudo dpkg -i cuda-keyring_1.0-1_all.deb
          sudo apt-get update
          sudo apt-get -y install cuda-minimal-build-11-8
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - run: cargo update
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test 'cudart' feature
        shell: bash
        run: |
          cargo nextest run --manifest-path dev-tools/cc-test/Cargo.toml --features test_cuda
          CXX=clang++ cargo nextest run --manifest-path dev-tools/cc-test/Cargo.toml --features test_cuda
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  msrv:
    name: MSRV
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get msrv
        uses: ./.github/actions/get-msrv
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          toolchain: ${{ env.MSRV }}
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: |
            cargo-hack
            cargo-minimal-versions
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo minimal-versions check --workspace --all-targets --feature-powerset --ignore-private

  clippy:
    name: Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: clippy
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: |
            cargo-hack
          fallback: none
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo hack clippy --no-deps --workspace --all-targets --feature-powerset --ignore-private -- -D warnings
      # check that there are no uncommitted changes to prevent bugs like https://github.com/rust-lang/cc-rs/issues/1411
      - name: check clean Git workting tree
        uses: ./.github/actions/check-clean-git-working-tree

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          components: rustfmt
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt -- --check

  semver-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          release-type: minor

  # Dummy job to have a stable name for the "all tests pass" requirement
  tests-pass:
    name: Tests pass
    needs:
      - test
      - test-linker-plugin-lto
      - check-build-std
      - check-wasm
      - test-wasi
      - cuda
      - msrv
      - clippy
      - rustfmt
      - semver-checks
    if: always() # always run even if dependencies fail
    runs-on: ubuntu-latest
    steps:
      # fail if ANY dependency has failed or cancelled
      - if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
        run: exit 1
      - run: exit 0
